name: Qarin daily story

# يصمّم ستوري انستقرام يومية من بحث حقيقي في قارِن ويحفظها في فرع story-out.
on:
  schedule:
    - cron: "17 16 * * *"   # 8:17 مساءً بتوقيت عمان
  workflow_dispatch:
    inputs:
      query:
        description: "بحث معيّن (اختياري)"
        required: false

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm i --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null
      - name: Make story
        env:
          OUT: story-out
          QUERY: ${{ github.event.inputs.query }}
        run: node tools/story/story.js
      - name: Publish story
        run: |
          set -e
          mkdir -p /tmp/out && cp -r story-out/* /tmp/out/
          cd /tmp/out
          git init -q -b story-out
          git config user.name "qarin-story"; git config user.email "story@users.noreply.github.com"
          git add -A && git commit -q -m "story $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" story-out
