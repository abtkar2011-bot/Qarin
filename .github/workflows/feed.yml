name: Build and publish Qarin

# يبني فهرس كل منتجات علي إكسبرس وينشر الموقع على GitHub Pages
#  - كل يوم الساعة 6:17 صباحًا بتوقيت عمان: ينزّل المنتجات الجديدة
#  - لما ترفع ملف (مثل index.html): ينشر الموقع على طول بآخر منتجات محفوظة
#  - زر تشغيل يدوي (Run workflow)
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved products
        id: saved
        uses: actions/cache/restore@v4
        with:
          path: products
          key: qarin-products-${{ github.run_id }}
          restore-keys: qarin-products-

      - name: Decide
        id: need
        run: |
          # نعيد التحميل كل يوم، أو لو تغيّر build_feed.py. غير كذا نستخدم المنتجات المحفوظة (نشر سريع)
          want=$(sha256sum build_feed.py | cut -c1-16)
          have=$(cat products/.builder 2>/dev/null || true)
          echo "builder: want=$want have=$have"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ steps.saved.outputs.cache-matched-key }}" ] && [ "$want" = "$have" ]; then
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "Using saved products"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"; echo "Downloading all products"
          fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.build == 'yes'
        with:
          python-version: "3.12"

      - name: Restore price history
        if: steps.need.outputs.build == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: history
          key: qarin-history-${{ github.run_id }}
          restore-keys: qarin-history-

      - name: Build product index (all AliExpress products)
        if: steps.need.outputs.build == 'yes'
        env:
          ADMITAD_FEED_URL: ${{ secrets.ADMITAD_FEED_URL }}
          OUT_DIR: products
          HISTORY_DIR: history
        run: |
          python build_feed.py
          sha256sum build_feed.py | cut -c1-16 > products/.builder

      - name: Save price history
        if: steps.need.outputs.build == 'yes'
        uses: actions/cache/save@v4
        with:
          path: history
          key: qarin-history-${{ github.run_id }}

      - name: Save products for next time
        if: steps.need.outputs.build == 'yes'
        uses: actions/cache/save@v4
        with:
          path: products
          key: qarin-products-${{ github.run_id }}

      # منتجات المتاجر الشريكة (V Perfumes و DermaZone) من صفحاتها العامة ← data/p
      - name: Restore partner stores
        uses: actions/cache/restore@v4
        with:
          path: partners
          key: qarin-partners-${{ github.run_id }}
          restore-keys: qarin-partners-

      - name: Partner stores
        id: partners
        continue-on-error: true
        timeout-minutes: 70
        run: |
          want=$(sha256sum tools/partners/build.js | cut -c1-16)
          have=$(cat partners/.builder 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "push" ] && [ -f partners/index.json ] && [ "$want" = "$have" ]; then
            echo "Using saved partner products"; echo "built=no" >> "$GITHUB_OUTPUT"
          else
            node tools/partners/build.js partners && echo "$want" > partners/.builder
            echo "built=yes" >> "$GITHUB_OUTPUT"
          fi
          ls -la partners

      - name: Save partner stores
        if: steps.partners.outputs.built == 'yes'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: partners
          key: qarin-partners-${{ github.run_id }}

      # 🔎 صفحات قوقل (مقارنة الأسعار) + عروض اليوم + تاريخ الأسعار (يتسجل كل يوم في الكاش)
      - name: Restore store price history
        uses: actions/cache/restore@v4
        with:
          path: pricehist
          key: qarin-phist-${{ github.run_id }}
          restore-keys: qarin-phist-

      - name: Comparison pages, deals, price history
        id: seo
        continue-on-error: true
        run: node tools/seo/build.js partners pricehist seoout

      - name: Save store price history
        if: steps.seo.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: pricehist
          key: qarin-phist-${{ github.run_id }}

      # 📷 «بصمة شكل» لكل صورة منتج في المتاجر الشريكة (للبحث بنفس الشكل) ← data/pe + models
      # Node 20 ثابت (نسخة الجهاز تتغير، وأداة الصور اختبرناها على 20)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore image prints
        uses: actions/cache/restore@v4
        with:
          path: embcache
          key: qarin-emb-${{ github.run_id }}
          restore-keys: qarin-emb-

      - name: Image prints
        id: emb
        continue-on-error: true
        timeout-minutes: 45
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          EMB_MODEL: Xenova/dinov2-small
          EMB_DTYPE: q8
        run: |
          node -v; npm -v
          (cd tools/embed && npm i --no-save --no-package-lock --no-audit --no-fund --loglevel=error --onnxruntime-node-install-cuda=skip @huggingface/transformers@3.7.1 sharp@0.33.5)
          node tools/embed/embed.js partners embcache embout

      - name: Save image prints
        if: steps.emb.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: embcache
          key: qarin-emb-${{ github.run_id }}

      # كوبونات Admitad (الرابط سرّي في الإعدادات) ← coupons.json
      - name: Coupons
        continue-on-error: true
        env:
          COUPONS_FEED_URL: ${{ secrets.COUPONS_FEED_URL }}
        run: python3 build_coupons.py

      # 🔐 بيانات صفحة الأدمن، مشفّرة بكلمة السر (ADMIN_PASS في أسرار المستودع)
      - name: Admin data
        continue-on-error: true
        env:
          HEALTH_PREV: /tmp/hp/log.json
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          ST_PARTNERS: ${{ steps.partners.outcome }}
          ST_PRINTS: ${{ steps.emb.outcome }}
          ST_SEO: ${{ steps.seo.outcome }}
        run: |
          git clone -q --depth 1 -b health-out "https://github.com/${{ github.repository }}.git" /tmp/hp 2>/dev/null || mkdir -p /tmp/hp
          node tools/admin/build.js partners adminout

      # صحة المتاجر للتقرير الأسبوعي: فرع health-out (بدون روابط ولا بيانات زوار)
      - name: Store health
        continue-on-error: true
        run: |
          mkdir -p /tmp/ho && cp adminout/health.json adminout/log.json /tmp/ho/ && cd /tmp/ho
          git init -q -b health-out && git add -A
          git -c user.name="qarin-bot" -c user.email="qarin-bot@users.noreply.github.com" commit -qm "health $(date -u +%F' '%H:%M)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" health-out

      - name: Put the site together
        run: |
          mkdir -p _site
          for f in *; do case "$f" in build_feed.py|build_coupons.py|qa|tools|products|history|partners|embcache|embout|pricehist|seoout|adminout|_site) ;; *) cp -r "$f" _site/ ;; esac; done
          mkdir -p _site/data
          cp -r products _site/data/s
          mkdir -p _site/data/p && cp partners/*.json _site/data/p/ 2>/dev/null || true
          mkdir -p _site/data/pe && cp embout/pe/* _site/data/pe/ 2>/dev/null || true
          [ -d embout/models ] && cp -r embout/models _site/models || true
          mkdir -p _site/admin && cp adminout/data.json _site/admin/ 2>/dev/null || true
          if [ -d seoout/compare ]; then cp -r seoout/compare _site/compare; cp seoout/deals.html seoout/sitemap.xml seoout/robots.txt _site/; cp -r seoout/data/* _site/data/; fi
          echo "files: $(find _site -type f | wc -l)"; du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # نخبر محركات البحث (Bing وغيرها عبر IndexNow) إن الموقع تحدّث
      - name: Ping search engines
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "indexnow %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"abtkar2011-bot.github.io","key":"e08aed26014600e923489f7372bafc74","keyLocation":"https://abtkar2011-bot.github.io/Qarin/e08aed26014600e923489f7372bafc74.txt","urlList":["https://abtkar2011-bot.github.io/Qarin/","https://abtkar2011-bot.github.io/Qarin/searches.html","https://abtkar2011-bot.github.io/Qarin/about.html"]}' || true
