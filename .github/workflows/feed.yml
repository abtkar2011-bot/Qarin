name: Build and publish Qarin

# يبني فهرس كل منتجات علي إكسبرس وينشر الموقع على GitHub Pages
#  - كل يوم الساعة 6:17 صباحًا بتوقيت عمان: ينزّل المنتجات الجديدة
#  - لما ترفع ملف (مثل index.html): ينشر الموقع على طول بآخر منتجات محفوظة
#  - زر تشغيل يدوي (Run workflow)
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved products
        id: saved
        uses: actions/cache/restore@v4
        with:
          path: products
          key: qarin-products-${{ hashFiles('build_feed.py') }}-${{ github.run_id }}
          restore-keys: qarin-products-${{ hashFiles('build_feed.py') }}-

      - name: Decide
        id: need
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ steps.saved.outputs.cache-matched-key }}" ]; then
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "Using saved products"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"; echo "Downloading all products"
          fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.build == 'yes'
        with:
          python-version: "3.12"

      - name: Build product index (all AliExpress products)
        if: steps.need.outputs.build == 'yes'
        env:
          ADMITAD_FEED_URL: ${{ secrets.ADMITAD_FEED_URL }}
          OUT_DIR: products
        run: python build_feed.py

      - name: Save products for next time
        if: steps.need.outputs.build == 'yes'
        uses: actions/cache/save@v4
        with:
          path: products
          key: qarin-products-${{ hashFiles('build_feed.py') }}-${{ github.run_id }}

      - name: Put the site together
        run: |
          mkdir -p _site/data
          cp *.html _site/
          if [ -d data ]; then cp -r data/. _site/data/; fi
          cp -r products _site/data/s
          echo "files: $(find _site -type f | wc -l)"; du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
