name: Update AliExpress products

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build product files
        env:
          ADMITAD_FEED_URL: ${{ secrets.ADMITAD_FEED_URL }}
        run: python build_feed.py
      - name: Save changes
        run: |
          git config user.name "qarin-bot"
          git config user.email "qarin-bot@users.noreply.github.com"
          git add data/ali
          git diff --cached --quiet || git commit -m "Update AliExpress products"
          git push
