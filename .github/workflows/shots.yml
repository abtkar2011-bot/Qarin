name: Qarin screenshots

# يصوّر الموقع الحقيقي على جوال (للفيديوهات) ويحفظ الصور في فرع shots-out.
on:
  push:
    branches: [shots-run]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm i --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji fonts-noto-core >/dev/null
      - name: Take screenshots
        env:
          OUT: shots-out
        run: node qa/shots.js
      - name: Publish screenshots
        if: always()
        run: |
          set -e
          mkdir -p /tmp/out && cp -r shots-out/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b shots-out
          git config user.name "qarin-shots"; git config user.email "shots@users.noreply.github.com"
          git add -A && git commit -q -m "screenshots ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots-out
